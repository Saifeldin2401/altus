name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate Migrations
        run: npm run check:migrations

      - name: Lint
        run: npm run lint

      - name: Guardrails
        run: npm run check:guardrails

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Security Audit
        run: npm run audit:ci

  # Edge Functions run on Deno and are deployed separately from the web build,
  # so nothing else type-checks them. An undeclared variable in a shared helper
  # once reached main this way.
  edge-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/deno.jsonc supabase/functions/*/index.ts supabase/functions/_shared/*.ts

  # Tenant-isolation and learning-integrity suites. Each builds its own
  # fixtures, impersonates users the way PostgREST does and rolls back, so they
  # are safe to run against the shared staging database. Never point this at
  # production.
  database-tests:
    runs-on: ubuntu-latest
    needs: quality-gates
    permissions:
      contents: read
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report missing staging database
        if: env.STAGING_DB_URL == ''
        run: echo "::warning::STAGING_DB_URL secret is not set; database regression suites were skipped."

      - name: Run SQL regression suites against staging
        if: env.STAGING_DB_URL != ''
        run: |
          for suite in supabase/tests/*.sql; do
            echo "::group::$suite"
            psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -q -f "$suite"
            echo "::endgroup::"
          done

